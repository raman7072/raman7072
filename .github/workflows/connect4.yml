name: 🔴🟡 Connect-4 Game Engine

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'connect4|')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🎮 Process Move
        id: game_step
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          OUTPUT=$(python3 connect4/game.py --command "$ISSUE_TITLE" --user "$ISSUE_USER")
          echo "game_output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 💬 Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.game_step.outputs.game_output }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### 🎮 RamanBot Connect-4 Engine\n\n${output}\n\n[View Profile & Board](https://github.com/${context.repo.owner}/${context.repo.repo})`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: 🚀 Commit & Push Game State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add connect4/state.json README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🎮 Update Connect-4 game board [skip ci]"
            git push
          fi

